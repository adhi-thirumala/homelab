# Secret values live in the ignored root .env and are passed by Compose.
# Museum's ENTE_* environment overrides replace these literal placeholders;
# this YAML file itself does not interpolate environment variables.
# Run Compose from the repository root. After editing .env, recreate Museum:
# docker compose up -d --no-deps ente-museum
# Back up .env securely with the database. Do not regenerate ENTE_KEY_ENCRYPTION
# or ENTE_KEY_HASH for an existing database without migrating protected data.
db:
  host: ente-postgres
  port: 5432
  name: ente_db
  user: ente
  password: REPLACE_VIA_ENTE_DB_PASSWORD

s3:
  # External HTTPS object storage
  are_local_buckets: false

  # Backblaze supports virtual-hosted bucket URLs,
  # so path-style URLs aren't necessary.
  use_path_style_urls: false

  b2-eu-cen:
    key: REPLACE_VIA_ENTE_S3_B2_EU_CEN_KEY
    secret: REPLACE_VIA_ENTE_S3_B2_EU_CEN_SECRET
    endpoint: s3.us-east-005.backblazeb2.com
    region: us-east-005
    bucket: ente-photos-adhithirumala

apps:
  public-albums: https://photos-albums.adhithirumala.com

key:
  encryption: REPLACE_VIA_ENTE_KEY_ENCRYPTION
  hash: REPLACE_VIA_ENTE_KEY_HASH

jwt:
  secret: REPLACE_VIA_ENTE_JWT_SECRET
